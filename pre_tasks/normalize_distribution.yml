---
- name: Preserve original distribution fact
  ansible.builtin.set_fact:
    dotfiles_distribution_original: "{{ ansible_facts['distribution'] }}"
    dotfiles_distribution_normalized: >-
      {%- if ansible_facts['distribution'] in ['CachyOS', 'Archlinux', 'EndeavourOS', 'Manjaro', 'Arch Linux', 'Arch'] -%}
      Archlinux
      {%- elif ansible_facts['distribution_file_variety'] | default('') in ['Archlinux', 'Arch'] -%}
      Archlinux
      {%- elif ansible_facts['distribution'] in ['Debian'] -%}
      Ubuntu
      {%- else -%}
      {{ ansible_facts['distribution'] }}
      {%- endif -%}
  tags:
    - always

- name: Normalize Arch-family and Debian-family distribution task selection
  ansible.builtin.set_fact:
    ansible_facts: "{{ ansible_facts | combine({'distribution_original': dotfiles_distribution_original, 'distribution': dotfiles_distribution_normalized}) }}"
  when: dotfiles_distribution_normalized != ansible_facts['distribution']
  tags:
    - always

- name: Show normalized distribution
  ansible.builtin.debug:
    msg: "Distribution normalized: {{ ansible_facts['distribution_original'] | default(ansible_facts['distribution']) }} -> {{ ansible_facts['distribution'] }}"
  tags:
    - always
