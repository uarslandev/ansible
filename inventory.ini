# ==============================================================================
# Ansible Monorepo Inventory
# ==============================================================================

# Local node (Arch host or WSL instance)
[local]
localhost ansible_connection=local

# Workstations (Arch hosts and WSL instances)
[workstations]
localhost

# Home Servers / Remote Nodes (Targeted via SSH in the future)
[servers]
# homeserver.local ansible_host=192.168.1.100 ansible_user=user

# Meta-group combining all Linux Workstations
[dev_machines:children]
workstations
