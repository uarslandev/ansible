name: Ansible Lint & Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validation:
    name: Playbook Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible & Linter
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint

      - name: Install Galaxy Collections
        run: |
          ansible-galaxy collection install -r requirements/common.yml

      - name: Syntax Check Playbooks
        run: |
          ansible-playbook main.yml --syntax-check
          ansible-playbook site.yml --syntax-check
          ansible-playbook workstation.yml --syntax-check
          ansible-playbook pc.yml --syntax-check
          ansible-playbook thinkpad.yml --syntax-check
          ansible-playbook sync.yml --syntax-check

      - name: Run Ansible Lint
        run: |
          ansible-lint main.yml
