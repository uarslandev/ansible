---
# ==============================================================================
# Automatic package pruning (auto-uninstall when removed from system_packages)
# ==============================================================================

# 1. Read previously managed package manifest if it exists
- name: Check for previously managed pacman package manifest
  ansible.builtin.stat:
    path: /var/lib/ansible_managed_pacman_packages.json
  register: pacman_manifest_stat

- name: Read previous pacman package manifest
  ansible.builtin.slurp:
    src: /var/lib/ansible_managed_pacman_packages.json
  register: previous_pacman_manifest_raw
  when: pacman_manifest_stat.stat.exists

- name: Set previous pacman package list
  ansible.builtin.set_fact:
    previous_pacman_packages: "{{ (previous_pacman_manifest_raw.content | b64decode | from_json) if pacman_manifest_stat.stat.exists else [] }}"

- name: Calculate packages to auto-remove
  ansible.builtin.set_fact:
    packages_to_remove: "{{ previous_pacman_packages | difference(system_packages) }}"

- name: Auto-remove packages no longer listed in system_packages
  become: true
  ansible.builtin.pacman:
    name: "{{ packages_to_remove }}"
    state: absent
  when: packages_to_remove | length > 0

- name: Install current Arch packages
  become: true
  ansible.builtin.pacman:
    name: "{{ system_packages }}"
    state: present

- name: Save updated pacman package manifest
  become: true
  ansible.builtin.copy:
    content: "{{ system_packages | to_nice_json }}"
    dest: /var/lib/ansible_managed_pacman_packages.json
    mode: '0644'

