---
# ==============================================================================
# Automatic package pruning (auto-uninstall when removed from system_packages)
# ==============================================================================

# 1. Read previously managed package manifest if it exists
- name: Check for previously managed pacman package manifest
  ansible.builtin.stat:
    path: /var/lib/ansible_managed_pacman_packages.json
  register: pacman_manifest_stat

- name: Read previous pacman package manifest
  ansible.builtin.slurp:
    src: /var/lib/ansible_managed_pacman_packages.json
  register: previous_pacman_manifest_raw
  when: pacman_manifest_stat.stat.exists

- name: Set previous pacman package list
  ansible.builtin.set_fact:
    previous_pacman_packages: "{{ (previous_pacman_manifest_raw.content | b64decode | from_json) if pacman_manifest_stat.stat.exists else [] }}"

- name: Calculate packages to auto-remove
  ansible.builtin.set_fact:
    packages_to_remove: "{{ previous_pacman_packages | difference(system_packages) }}"

- name: Auto-remove packages no longer listed in system_packages
  become: true
  ansible.builtin.pacman:
    name: "{{ packages_to_remove }}"
    state: absent
  when: packages_to_remove | length > 0

- name: Install current Arch packages
  become: true
  ansible.builtin.pacman:
    name: "{{ system_packages }}"
    state: present

- name: Save updated pacman package manifest
  become: true
  ansible.builtin.copy:
    content: "{{ system_packages | to_nice_json }}"
    dest: /var/lib/ansible_managed_pacman_packages.json
    mode: '0644'

- name: Copy paru setup script
  ansible.builtin.copy:
    src: install_paru.sh
    dest: /tmp/install_paru.sh
    mode: '0755'

- name: Install paru using setup script
  become: true
  ansible.builtin.command:
    cmd: /tmp/install_paru.sh
  args:
    creates: /usr/bin/paru

- name: Enable and start ly display manager
  become: true
  ansible.builtin.systemd_service:
    name: ly.service
    enabled: true
    state: started

- name: Ensure Flathub repository is configured
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo

# ==============================================================================
# Automatic Flatpak Pruning (Auto-uninstall when removed from flatpak_apps)
# ==============================================================================

- name: Check for previously managed Flatpak manifest
  ansible.builtin.stat:
    path: "{{ user_home }}/.local/share/ansible_managed_flatpaks.json"
  register: flatpak_manifest_stat

- name: Read previous Flatpak manifest
  ansible.builtin.slurp:
    src: "{{ user_home }}/.local/share/ansible_managed_flatpaks.json"
  register: previous_flatpak_manifest_raw
  when: flatpak_manifest_stat.stat.exists

- name: Set previous Flatpak list
  ansible.builtin.set_fact:
    previous_flatpak_apps: "{{ (previous_flatpak_manifest_raw.content | b64decode | from_json) if flatpak_manifest_stat.stat.exists else [] }}"

- name: Calculate Flatpaks to auto-remove
  ansible.builtin.set_fact:
    flatpaks_to_remove: "{{ previous_flatpak_apps | difference(flatpak_apps) }}"

- name: Auto-remove Flatpak applications no longer listed in flatpak_apps
  community.general.flatpak:
    name: "{{ flatpaks_to_remove }}"
    state: absent
  when: flatpaks_to_remove | length > 0

- name: Install Desktop Applications via Flatpak
  community.general.flatpak:
    name: "{{ flatpak_apps }}"
    state: present
    remote: flathub

- name: Save updated Flatpak manifest
  ansible.builtin.copy:
    content: "{{ flatpak_apps | to_nice_json }}"
    dest: "{{ user_home }}/.local/share/ansible_managed_flatpaks.json"
    mode: '0644'

# ==============================================================================
# Oh-My-Zsh & Powerlevel10k Automation
# ==============================================================================

- name: Clone Oh-My-Zsh repository
  ansible.builtin.git:
    repo: 'https://github.com/ohmyzsh/ohmyzsh.git'
    dest: "{{ user_home }}/.oh-my-zsh"
    depth: 1
    update: false

- name: Clone Powerlevel10k theme for Oh-My-Zsh
  ansible.builtin.git:
    repo: 'https://github.com/romkatv/powerlevel10k.git'
    dest: "{{ user_home }}/.oh-my-zsh/custom/themes/powerlevel10k"
    depth: 1
    update: false

# ==============================================================================
# Restore GNOME Settings (Theme, Keybindings, Dock, Touchpad)
# ==============================================================================

- name: Check if GNOME dconf settings dump exists
  ansible.builtin.stat:
    path: "{{ user_home }}/.config/dconf/settings.dconf"
  register: dconf_dump_stat

- name: Restore GNOME settings via dconf
  ansible.builtin.shell:
    cmd: "dconf load / < {{ user_home }}/.config/dconf/settings.dconf"
  when: dconf_dump_stat.stat.exists
  failed_when: false
  changed_when: false
