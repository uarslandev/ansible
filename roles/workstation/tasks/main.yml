- name: Deploy pkg-sync utility script
  ansible.builtin.copy:
    src: pkg-sync
    dest: "{{ user_bin }}/pkg-sync"
    mode: '0755'


- name: Check if ly templated systemd unit file exists
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/ly@.service
  register: ly_service_unit

- name: Enable and start ly on tty1
  become: true
  ansible.builtin.systemd_service:
    name: ly@tty1.service
    enabled: true
    state: started
  when:
    - ansible_service_mgr == "systemd"
    - ly_service_unit.stat.exists
