---
- name: Ensure ~/.local/bin exists for user DevOps binaries
  ansible.builtin.file:
    path: "{{ user_bin }}"
    state: directory
    mode: '0755'

- name: Download kubectl binary
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ devops_tool_versions.kubectl }}/bin/linux/amd64/kubectl"
    dest: "{{ user_bin }}/kubectl"
    mode: '0755'

- name: Download kind binary
  ansible.builtin.get_url:
    url: "https://kind.sigs.k8s.io/dl/{{ devops_tool_versions.kind }}/kind-linux-amd64"
    dest: "{{ user_bin }}/kind"
    mode: '0755'

- name: Install Starship prompt binary
  block:
    - name: Download Starship archive
      ansible.builtin.get_url:
        url: "https://github.com/starship/starship/releases/download/{{ devops_tool_versions.starship }}/starship-x86_64-unknown-linux-musl.tar.gz"
        dest: "/tmp/starship.tar.gz"
        mode: '0644'

    - name: Extract Starship binary
      ansible.builtin.unarchive:
        src: "/tmp/starship.tar.gz"
        dest: "{{ user_bin }}"
        remote_src: true

- name: Install Helm
  block:
    - name: Download Helm archive
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ devops_tool_versions.helm }}-linux-amd64.tar.gz"
        dest: "/tmp/helm.tar.gz"
        mode: '0644'

    - name: Extract Helm binary
      ansible.builtin.unarchive:
        src: "/tmp/helm.tar.gz"
        dest: "/tmp"
        remote_src: true

    - name: Move Helm binary to ~/.local/bin
      ansible.builtin.copy:
        src: "/tmp/linux-amd64/helm"
        dest: "{{ user_bin }}/helm"
        mode: '0755'
        remote_src: true

- name: Install k9s
  block:
    - name: Download k9s archive
      ansible.builtin.get_url:
        url: "https://github.com/derailed/k9s/releases/download/{{ devops_tool_versions.k9s }}/k9s_Linux_amd64.tar.gz"
        dest: "/tmp/k9s.tar.gz"
        mode: '0644'

    - name: Extract k9s binary directly to ~/.local/bin
      ansible.builtin.unarchive:
        src: "/tmp/k9s.tar.gz"
        dest: "{{ user_bin }}"
        remote_src: true
        include:
          - k9s

- name: Install Terraform
  block:
    - name: Download Terraform archive
      ansible.builtin.get_url:
        url: "https://releases.hashicorp.com/terraform/{{ devops_tool_versions.terraform }}/terraform_{{ devops_tool_versions.terraform }}_linux_amd64.zip"
        dest: "/tmp/terraform.zip"
        mode: '0644'

    - name: Extract Terraform binary to ~/.local/bin
      ansible.builtin.unarchive:
        src: "/tmp/terraform.zip"
        dest: "{{ user_bin }}"
        remote_src: true

- name: Clean up temporary installer archives
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/starship.tar.gz"
    - "/tmp/helm.tar.gz"
    - "/tmp/linux-amd64"
    - "/tmp/k9s.tar.gz"
    - "/tmp/terraform.zip"
