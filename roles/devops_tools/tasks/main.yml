---
# ==============================================================================
# DevOps Tools Role (Docker, Kubernetes ecosystem, Terraform)
# ==============================================================================

- name: DevOps | Check for distribution task file
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_facts['distribution'] }}.yml"
  register: devops_distro_task_stat

- name: DevOps | Execute distribution-specific tasks
  ansible.builtin.include_tasks: "{{ ansible_facts['distribution'] }}.yml"
  when: devops_distro_task_stat.stat.exists

- name: DevOps | Manage Docker group membership
  when:
    - can_become | default(false)
  block:
    - name: Ensure docker group exists
      become: true
      ansible.builtin.group:
        name: docker
        state: present
      failed_when: false

    - name: Add target user to docker group
      become: true
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: docker
        append: true
      failed_when: false
