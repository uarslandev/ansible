---
# Packages installed via pacman on Arch Linux workstations
system_packages:
  - neovim
  - ly
  - sway
  - i3status
  - swaybg
  - swayidle
  - swaylock
  - waybar
  - wofi
  - foot
  - thunar
  - grim
  - slurp
  - xorg-xwayland
  - xdg-desktop-portal
  - xdg-desktop-portal-wlr
  - wl-clipboard
  - torbrowser-launcher
  - tmux
  - zsh
  - git
  - curl
  - wget
  - htop
  - btop
  - fastfetch
  - ripgrep
  - fd
  - fzf
  - jq
  - unzip
  - tar
  - gcc
  - make
  - python-pip
  - nodejs
  - npm
  - util-linux
  - chezmoi

# AUR packages installed via paru (when available)
aur_packages:
  - zsh-autosuggestions-git
  - zsh-syntax-highlighting

# Versions for standalone DevOps tools
devops_tool_versions:
  kubectl: "v1.31.1"
  helm: "v3.16.1"
  k9s: "v0.32.5"
  terraform: "1.9.6"
  kind: "v0.24.0"
  starship: "v1.21.1"
