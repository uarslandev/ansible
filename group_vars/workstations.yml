---
# Packages installed via pacman on Arch Linux workstations
system_packages:
  - neovim
  - ly
  - sway
  - i3status
  - kdeconnect
  - nextcloud-client
  - tmux
  - zsh
  - zsh-autosuggestions-git
  - zsh-syntax-highlighting
  - git
  - curl
  - wget
  - htop
  - btop
  - fastfetch
  - ripgrep
  - fd
  - fzf
  - jq
  - unzip
  - tar
  - gcc
  - make
  - python-pip
  - nodejs
  - npm
  - util-linux
  - chezmoi
  - dconf
  - flatpak
  - xorg-xwayland
  - wl-clipboard
  - swaybg
  - swayidle
  - swaylock
  - waybar
  - foot
  - grim
  - slurp

# Media Codecs & Video Players
  - vlc
  - ffmpeg
  - libde265
  - x265

# Desktop GUI Applications installed via Flatpak
flatpak_apps:
  - dev.vencord.Vesktop
  - com.google.Chrome
  - com.spotify.Client
  - md.obsidian.Obsidian

# Versions for standalone DevOps tools
devops_tool_versions:
  kubectl: "v1.31.1"
  helm: "v3.16.1"
  k9s: "v0.32.5"
  terraform: "1.9.6"
  kind: "v0.24.0"
  starship: "v1.21.1"
