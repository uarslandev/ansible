---
# Packages installed via DNF on Fedora Workstations
dnf_packages:
  - neovim
  - tmux
  - zsh
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - git
  - curl
  - wget
  - htop
  - btop
  - fastfetch
  - ripgrep
  - fd-find
  - fzf
  - jq
  - unzip
  - tar
  - gcc
  - make
  - python3-pip
  - nodejs
  - npm
  - util-linux-user
  - chezmoi
  - dconf

# GNOME Management Tools
  - gnome-tweaks                             # GNOME Tweaks customization app
  - gnome-shell-extension-prefs              # GNOME Extensions GUI management app

# Media Codecs & Video Players (HEVC / H.265 / H.264 Support)
  - vlc
  - vlc-plugins-freeworld
  - libavcodec-freeworld
  - ffmpeg
  - ffmpeg-libs
  - libde265
  - x265
  - gstreamer1-plugins-bad-freeworld
  - gstreamer1-plugins-ugly

# Cool GNOME Desktop Extensions
  - gnome-shell-extension-dash-to-dock       # Customizable macOS/Ubuntu-style dock
  - gnome-shell-extension-appindicator       # System tray icons for Discord/Vesktop, Spotify, Obsidian
  - gnome-shell-extension-blur-my-shell      # Modern glassmorphism blur effects
  - gnome-shell-extension-caffeine           # Disable screen sleep with 1 click
  - gnome-shell-extension-just-perfection    # UI customization & animation speed control
  - gnome-shell-extension-freon             # System hardware temps, fans, & CPU stats in top bar
  - gnome-shell-extension-gsconnect         # Phone integration (notifications, SMS, battery)
  - gnome-shell-extension-pop-shell         # Automatic tiling window manager

# Desktop GUI Applications installed via Flatpak
flatpak_apps:
  - dev.vencord.Vesktop
  - com.google.Chrome
  - com.spotify.Client
  - md.obsidian.Obsidian

# Versions for standalone DevOps tools
devops_tool_versions:
  kubectl: "v1.31.1"
  helm: "v3.16.1"
  k9s: "v0.32.5"
  terraform: "1.9.6"
  kind: "v0.24.0"
  starship: "v1.21.1"
